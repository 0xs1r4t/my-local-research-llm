<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dissertation RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* Art direction: local dissertation RAG tool → precise, terminal-adjacent, research-tool energy
   Palette: dark-first, near-black surfaces, teal accent (matches existing stack)
   Typography: Geist body (clean, code-adjacent) — monospace for metadata
   Density: dense, functional */

:root {
  --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
  --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
  --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
  --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
  --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);

  --space-1:  0.25rem;
  --space-2:  0.5rem;
  --space-3:  0.75rem;
  --space-4:  1rem;
  --space-5:  1.25rem;
  --space-6:  1.5rem;
  --space-8:  2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;

  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);

  --font-body: 'Geist', 'Inter', sans-serif;
  --font-mono: 'Geist Mono', 'Fira Code', monospace;
}

/* Dark mode — default for this tool */
:root, [data-theme="dark"] {
  --color-bg:              #0e0e0c;
  --color-surface:         #141412;
  --color-surface-2:       #1a1917;
  --color-surface-offset:  #1f1e1c;
  --color-surface-dynamic: #272623;
  --color-divider:         #272523;
  --color-border:          #313030;

  --color-text:            #d8d7d5;
  --color-text-muted:      #7a7977;
  --color-text-faint:      #4a4947;
  --color-text-inverse:    #0e0e0c;

  --color-primary:         #4f98a3;
  --color-primary-hover:   #62adb8;
  --color-primary-active:  #3a7f8a;
  --color-primary-highlight: #1e3437;

  --color-success:         #6daa45;
  --color-error:           #d163a7;
  --color-warning:         #e8af34;

  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.4);
}

[data-theme="light"] {
  --color-bg:              #f7f6f2;
  --color-surface:         #f9f8f5;
  --color-surface-2:       #fbfbf9;
  --color-surface-offset:  #f3f0ec;
  --color-surface-dynamic: #e6e4df;
  --color-divider:         #dcd9d5;
  --color-border:          #d4d1ca;

  --color-text:            #28251d;
  --color-text-muted:      #7a7974;
  --color-text-faint:      #bab9b4;
  --color-text-inverse:    #f9f8f4;

  --color-primary:         #01696f;
  --color-primary-hover:   #0c4e54;
  --color-primary-active:  #0f3638;
  --color-primary-highlight: #cedcd8;

  --color-success:         #437a22;
  --color-error:           #a12c7b;
  --color-warning:         #d19900;

  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  height: 100%;
}
body {
  height: 100%;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
a, button, input, textarea { transition: color var(--transition-interactive), background var(--transition-interactive), border-color var(--transition-interactive), box-shadow var(--transition-interactive); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ─── LAYOUT ─── */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: 100%;
  height: 100dvh;
  overflow: hidden;
}

@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.open { display: flex; position: fixed; inset: 0; z-index: 100; width: 280px; }
}

/* ─── SIDEBAR ─── */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  overflow: hidden;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--color-divider);
}

.logo {
  flex-shrink: 0;
  color: var(--color-primary);
}

.logo-text {
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--color-text);
  line-height: 1.2;
}
.logo-text span {
  display: block;
  font-size: var(--text-xs);
  font-weight: 400;
  color: var(--color-text-muted);
  font-family: var(--font-mono);
}

.sidebar-actions {
  padding: var(--space-3) var(--space-3);
}

.btn-new-chat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: transparent;
  cursor: pointer;
}
.btn-new-chat:hover {
  color: var(--color-text);
  border-color: var(--color-text-faint);
  background: var(--color-surface-offset);
}

.sidebar-section-label {
  padding: var(--space-4) var(--space-4) var(--space-2);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 var(--space-2) var(--space-4);
  scrollbar-width: thin;
  scrollbar-color: var(--color-border) transparent;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
}
.chat-item:hover { background: var(--color-surface-offset); color: var(--color-text); }
.chat-item.active { background: var(--color-primary-highlight); color: var(--color-text); }
.chat-item.active .chat-item-icon { color: var(--color-primary); }
.chat-item-icon { flex-shrink: 0; opacity: 0.6; }
.chat-item.active .chat-item-icon { opacity: 1; }

.sidebar-footer {
  border-top: 1px solid var(--color-divider);
  padding: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.status-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-2);
  border-radius: var(--radius-md);
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  font-family: var(--font-mono);
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--color-text-faint);
  flex-shrink: 0;
}
.status-dot.online { background: var(--color-success); box-shadow: 0 0 4px var(--color-success); }
.status-dot.offline { background: var(--color-error); }
.status-dot.loading {
  background: var(--color-warning);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.sidebar-footer-actions {
  display: flex;
  gap: var(--space-1);
}

.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* ─── MAIN CHAT ─── */
.chat-main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-bg);
}

.chat-topbar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface);
  flex-shrink: 0;
}

.chat-topbar-title {
  flex: 1;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.model-badge {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--color-text-muted);
  background: var(--color-surface-offset);
  white-space: nowrap;
}
.model-badge-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--color-primary);
}

/* ─── MESSAGES ─── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  scrollbar-width: thin;
  scrollbar-color: var(--color-border) transparent;
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: var(--space-4);
  padding: var(--space-12);
  color: var(--color-text-faint);
}
.empty-state-icon {
  color: var(--color-text-faint);
  opacity: 0.5;
}
.empty-state h2 {
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--color-text-muted);
  letter-spacing: -0.01em;
}
.empty-state p {
  font-size: var(--text-sm);
  color: var(--color-text-faint);
  max-width: 36ch;
  line-height: 1.6;
}

.suggestion-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: center;
  margin-top: var(--space-2);
}
.chip {
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  cursor: pointer;
  background: var(--color-surface);
}
.chip:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-highlight);
}

/* Message rows */
.msg {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  max-width: 760px;
  width: 100%;
  margin-inline: auto;
  animation: msg-in 220ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  font-family: var(--font-mono);
}
.msg-avatar {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}
.msg-avatar.user { background: var(--color-surface-dynamic); color: var(--color-text-muted); }
.msg-avatar.assistant { background: var(--color-primary-highlight); color: var(--color-primary); }

.msg-content {
  font-size: var(--text-base);
  color: var(--color-text);
  line-height: 1.7;
}
.msg.user .msg-content {
  background: var(--color-surface-offset);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-lg);
  border: 1px solid oklch(from var(--color-text) l c h / 0.07);
}
.msg.assistant .msg-content { padding-left: var(--space-1); }

.msg-content p { max-width: 68ch; margin-bottom: var(--space-3); }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content strong { font-weight: 600; color: var(--color-text); }
.msg-content code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  padding: 0.1em 0.4em;
  border-radius: var(--radius-sm);
}
.msg-content pre {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  overflow-x: auto;
  margin: var(--space-3) 0;
}
.msg-content pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: var(--text-sm);
  line-height: 1.6;
}

/* Sources */
.sources {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-3);
}
.sources-label {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.source-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.source-chip {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--color-text-muted);
  cursor: pointer;
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.source-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
.source-chip-num {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-surface-dynamic);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}

/* Thinking / streaming indicator */
.thinking {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-text-faint);
  font-family: var(--font-mono);
  padding-left: var(--space-1);
}
.thinking-dots span {
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--color-primary);
  margin: 0 1px;
  animation: dot-bounce 1.2s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* ─── INPUT AREA ─── */
.chat-input-area {
  padding: var(--space-4);
  background: var(--color-bg);
  border-top: 1px solid var(--color-border);
  flex-shrink: 0;
}

.input-box {
  max-width: 760px;
  margin-inline: auto;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  display: flex;
  flex-direction: column;
  gap: 0;
  transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive);
}
.input-box:focus-within {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px oklch(from var(--color-primary) l c h / 0.12);
}

textarea#query {
  width: 100%;
  background: transparent;
  border: none;
  resize: none;
  padding: var(--space-4) var(--space-5) var(--space-2);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--color-text);
  outline: none;
  min-height: 52px;
  max-height: 200px;
  font-family: var(--font-body);
}
textarea#query::placeholder { color: var(--color-text-faint); }

.input-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) var(--space-3) var(--space-3);
}

.input-options {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.input-option-btn {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-md);
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  font-family: var(--font-mono);
}
.input-option-btn:hover { background: var(--color-surface-offset); color: var(--color-text-muted); }
.input-option-btn.active { color: var(--color-primary); background: var(--color-primary-highlight); }

.send-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: white;
  flex-shrink: 0;
}
.send-btn:hover { background: var(--color-primary-hover); }
.send-btn:active { background: var(--color-primary-active); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.input-hint {
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  padding-top: var(--space-2);
  font-family: var(--font-mono);
  max-width: 760px;
  margin-inline: auto;
}

/* ─── MOBILE TOPBAR ─── */
.mobile-topbar {
  display: none;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface);
}
@media (max-width: 768px) {
  .mobile-topbar { display: flex; }
  .chat-topbar { display: none; }
}

/* scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: var(--radius-full); }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Chat history">
    <div class="sidebar-header">
      <!-- SVG Logo: abstract doc+spark mark -->
      <svg class="logo" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="Dissertation RAG logo">
        <rect x="4" y="2" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 8h6M8 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="5" fill="currentColor" opacity="0.15"/>
        <path d="M18 20h4M20 18v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">
        Dissertation RAG
        <span>llama.cpp · RTX 5070 Ti</span>
      </div>
    </div>

    <div class="sidebar-actions">
      <button class="btn-new-chat" onclick="newChat()" aria-label="New chat">
        <i data-lucide="plus" style="width:14px;height:14px"></i>
        New chat
      </button>
    </div>

    <div class="sidebar-section-label">Recent</div>
    <div class="chat-list" id="chatList" role="list"></div>

    <div class="sidebar-footer">
      <div class="status-row">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">checking...</span>
      </div>
      <div class="sidebar-footer-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
          <i data-lucide="moon" style="width:16px;height:16px"></i>
        </button>
        <button class="icon-btn" onclick="toggleSettings()" aria-label="Settings">
          <i data-lucide="settings" style="width:16px;height:16px"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="chat-main" role="main">

    <!-- Desktop topbar -->
    <div class="chat-topbar">
      <div class="chat-topbar-title" id="chatTitle">New conversation</div>
      <div class="model-badge" id="modelBadge">
        <div class="model-badge-dot"></div>
        <span id="modelName">llama-3.1-8b-q4</span>
      </div>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
        <i data-lucide="sun-moon" style="width:16px;height:16px"></i>
      </button>
    </div>

    <!-- Mobile topbar -->
    <div class="mobile-topbar">
      <button class="icon-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Open sidebar">
        <i data-lucide="panel-left" style="width:18px;height:18px"></i>
      </button>
      <span style="font-size:var(--text-sm);font-weight:500;color:var(--color-text-muted);flex:1">Dissertation RAG</span>
      <div class="model-badge">
        <div class="model-badge-dot"></div>
        <span>local</span>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages" aria-live="polite" aria-label="Chat messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="6" width="22" height="30" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M14 14h10M14 19h7M14 24h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="35" cy="35" r="9" fill="currentColor" opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
            <path d="M32 35h6M35 32v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h2>Ask your papers</h2>
        <p>Query your dissertation corpus. Sources are cited from your pgvector index.</p>
        <div class="suggestion-chips" id="suggestions">
          <button class="chip" onclick="useChip(this)">What is the main argument of Smith 2022?</button>
          <button class="chip" onclick="useChip(this)">Summarise the methodology across papers</button>
          <button class="chip" onclick="useChip(this)">Compare findings on transformer attention</button>
          <button class="chip" onclick="useChip(this)">What papers cite dropout regularisation?</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-box">
        <textarea
          id="query"
          placeholder="Ask something about your papers…"
          rows="1"
          aria-label="Query input"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <div class="input-footer">
          <div class="input-options">
            <button class="input-option-btn active" id="btnHybrid" onclick="toggleOption('hybrid')" title="Hybrid search (semantic + full-text)">
              <i data-lucide="layers" style="width:12px;height:12px"></i> hybrid
            </button>
            <button class="input-option-btn" id="btnRerank" onclick="toggleOption('rerank')" title="Enable reranking">
              <i data-lucide="arrow-up-down" style="width:12px;height:12px"></i> rerank
            </button>
            <button class="input-option-btn" id="btnStream" onclick="toggleOption('stream')" title="Stream response">
              <i data-lucide="zap" style="width:12px;height:12px"></i> stream
            </button>
          </div>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message" disabled>
            <i data-lucide="arrow-up" style="width:16px;height:16px"></i>
          </button>
        </div>
      </div>
      <p class="input-hint">↵ send · shift+↵ newline · queries your local FastAPI backend at <code style="font-family:var(--font-mono);font-size:0.9em">localhost:8000</code></p>
    </div>
  </main>
</div>

<script>
// ─── STATE ───
const state = {
  chats: [],
  activeChat: null,
  isLoading: false,
  serverOnline: false,
  options: { hybrid: true, rerank: false, stream: false },
  model: 'checking…',
  apiBase: 'http://localhost:8000',
};

// ─── THEME ───
(function(){
  const root = document.documentElement;
  const toggles = document.querySelectorAll('[data-theme-toggle]');
  let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', theme);
  function updateIcons() {
    const isDark = theme === 'dark';
    toggles.forEach(t => {
      t.innerHTML = isDark
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    });
  }
  toggles.forEach(t => t.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    updateIcons();
  }));
  updateIcons();
})();

// ─── LUCIDE ───
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  checkServerStatus();
  setInterval(checkServerStatus, 10000);
  newChat();
  document.getElementById('query').addEventListener('input', () => {
    const v = document.getElementById('query').value.trim();
    document.getElementById('sendBtn').disabled = !v || state.isLoading;
  });
});

// ─── SERVER STATUS ───
async function checkServerStatus() {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot loading';
  txt.textContent = 'connecting…';
  try {
    const r = await fetch(`${state.apiBase}/health`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      const data = await r.json().catch(() => ({}));
      state.serverOnline = true;
      state.model = data.model || 'llama-3.1-8b';
      dot.className = 'status-dot online';
      txt.textContent = state.model;
      document.getElementById('modelName').textContent = state.model;
    } else throw new Error();
  } catch {
    state.serverOnline = false;
    dot.className = 'status-dot offline';
    txt.textContent = 'offline · localhost:8000';
  }
}

// ─── CHAT MANAGEMENT ───
function newChat() {
  const id = Date.now().toString();
  const chat = { id, title: 'New conversation', messages: [], createdAt: Date.now() };
  state.chats.unshift(chat);
  state.activeChat = id;
  renderChatList();
  renderMessages();
  document.getElementById('chatTitle').textContent = 'New conversation';
  document.getElementById('query').focus();
}

function switchChat(id) {
  state.activeChat = id;
  const chat = getChat();
  document.getElementById('chatTitle').textContent = chat.title;
  renderChatList();
  renderMessages();
}

function getChat() {
  return state.chats.find(c => c.id === state.activeChat);
}

function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = state.chats.map(c => `
    <div class="chat-item ${c.id === state.activeChat ? 'active' : ''}" 
         onclick="switchChat('${c.id}')" role="listitem" tabindex="0"
         onkeydown="if(event.key==='Enter')switchChat('${c.id}')">
      <i class="chat-item-icon" data-lucide="message-square" style="width:14px;height:14px"></i>
      <span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(c.title)}</span>
    </div>
  `).join('');
  lucide.createIcons({ nodes: [list] });
}

// ─── MESSAGES ───
function renderMessages() {
  const container = document.getElementById('chatMessages');
  const chat = getChat();
  if (!chat || chat.messages.length === 0) {
    container.innerHTML = `<div class="empty-state" id="emptyState">
      <div class="empty-state-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="8" y="6" width="22" height="30" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 14h10M14 19h7M14 24h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="35" cy="35" r="9" fill="currentColor" opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
          <path d="M32 35h6M35 32v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>Ask your papers</h2>
      <p>Query your dissertation corpus. Sources are cited from your pgvector index.</p>
      <div class="suggestion-chips">
        <button class="chip" onclick="useChip(this)">What is the main argument of Smith 2022?</button>
        <button class="chip" onclick="useChip(this)">Summarise the methodology across papers</button>
        <button class="chip" onclick="useChip(this)">Compare findings on transformer attention</button>
        <button class="chip" onclick="useChip(this)">What papers cite dropout regularisation?</button>
      </div>
    </div>`;
    return;
  }
  container.innerHTML = chat.messages.map(renderMsg).join('');
  container.scrollTop = container.scrollHeight;
}

function renderMsg(msg) {
  const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const isUser = msg.role === 'user';
  const avatar = isUser ? 'U' : 'AI';
  const name = isUser ? 'you' : 'assistant';

  let sourcesHtml = '';
  if (msg.sources && msg.sources.length > 0) {
    sourcesHtml = `<div class="sources">
      <div class="sources-label">sources</div>
      <div class="source-chips">
        ${msg.sources.map((s, i) => {
          const label = s.source || s.title || s.file || 'chunk';
          const rawSource = s.metadata?.raw_source || s.file || s.source || '';
          const page = s.metadata?.page ? ` · page ${s.metadata.page}` : '';
          const score = typeof s.score === 'number' ? s.score.toFixed(3) : 'n/a';

          return `
            <span class="source-chip" title="${escapeHtml(rawSource)}${page} — score: ${score}">
              <span class="source-chip-num">${i + 1}</span>
              ${escapeHtml(truncate(label, 32))}
            </span>
          `;
        }).join('')}
      </div>
    </div>`;
  }

  const contentHtml = isUser
    ? `<div class="msg-content">${escapeHtml(msg.content).replace(/\n/g,'<br>')}</div>`
    : `<div class="msg-content">${formatMarkdown(msg.content)}${sourcesHtml}</div>`;

  return `<div class="msg ${msg.role}">
    <div class="msg-meta">
      <div class="msg-avatar ${msg.role}">${avatar}</div>
      <span>${name}</span>
      <span>${time}</span>
      ${msg.ms ? `<span style="color:var(--color-text-faint)">${msg.ms}ms</span>` : ''}
    </div>
    ${contentHtml}
  </div>`;
}

function appendThinking() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'thinkingMsg';
  div.innerHTML = `
    <div class="msg-meta">
      <div class="msg-avatar assistant">AI</div>
      <span>assistant</span>
    </div>
    <div class="thinking">
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      <span>retrieving & generating</span>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeThinking() {
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

// ─── SEND ───
async function sendMessage() {
  const input = document.getElementById('query');
  const text = input.value.trim();
  if (!text || state.isLoading) return;

  const chat = getChat();
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  chat.messages.push({ role: 'user', content: text, ts: Date.now() });
  if (chat.title === 'New conversation') {
    chat.title = truncate(text, 40);
    document.getElementById('chatTitle').textContent = chat.title;
  }

  input.value = '';
  autoResize(input);
  document.getElementById('sendBtn').disabled = true;
  state.isLoading = true;

  renderMessages();
  appendThinking();

  const t0 = Date.now();

  try {
    if (!state.serverOnline) throw new Error('Server offline — start your FastAPI backend first.');

    const payload = {
      thread_id: chat.threadId,
      query: text,
      hybrid: state.options.hybrid,
      rerank: state.options.rerank,
      stream: state.options.stream,
      history_limit: 8,
    };

    const res = await fetch(`${state.apiBase}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const ms = Date.now() - t0;

    if (data.thread_id) {
      chat.id = data.thread_id;
      state.activeChat = data.thread_id;
    }

    removeThinking();
    chat.messages.push({
      role: 'assistant',
      content: data.answer || data.response || data.text || JSON.stringify(data),
      sources: data.sources || data.chunks || [],
      ts: Date.now(),
      ms,
    });

  } catch (err) {
    removeThinking();
    chat.messages.push({
      role: 'assistant',
      content: `**Error:** ${err.message}\n\nMake sure your FastAPI backend is running:\n\`\`\`bash\nuvicorn rag.pipeline:app --reload\n\`\`\``,
      ts: Date.now(),
    });
  }

  state.isLoading = false;
  renderMessages();
  renderChatList();
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

// ─── OPTIONS TOGGLES ───
function toggleOption(key) {
  state.options[key] = !state.options[key];
  document.getElementById('btn' + key.charAt(0).toUpperCase() + key.slice(1))
    .classList.toggle('active', state.options[key]);
}

function toggleSettings() {
  const base = prompt('FastAPI base URL:', state.apiBase);
  if (base) { state.apiBase = base.replace(/\/$/, ''); checkServerStatus(); }
}

// ─── UTILS ───
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  document.getElementById('sendBtn').disabled = !el.value.trim() || state.isLoading;
}

function useChip(el) {
  const q = document.getElementById('query');
  q.value = el.textContent.trim();
  q.focus();
  autoResize(q);
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function formatMarkdown(text) {
  // Very light markdown: bold, inline code, code blocks, newlines
  return escapeHtml(text)
    .replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^(.+)$/, '<p>$1</p>');
}
</script>
</body>
</html>
